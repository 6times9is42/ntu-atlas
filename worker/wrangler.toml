# NTU Atlas events feed: collects campus events and serves them at ntuatlas.com/api/events
name = "ntu-atlas-events"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Serve the API on the same domain as the site, so the page can fetch it
routes = [
  { pattern = "ntuatlas.com/api/*", zone_name = "ntuatlas.com" }
]

# Check sources every two hours
[triggers]
crons = ["0 */2 * * *"]

[[kv_namespaces]]
binding = "EVENTS_KV"
id = "9faa53e5d30b4e74975571f6b7abe24a"

[vars]
# Public Telegram channels to read (comma-separated usernames)
TELEGRAM_CHANNELS = "ntusu"
GROQ_MODEL = "openai/gpt-oss-120b"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   GROQ_API_KEY  – from console.groq.com
#   ADMIN_TOKEN   – any long random string; lets you trigger a refresh by hand
#   ALLOWED_FORWARDERS – addresses allowed to forward event emails, comma-separated (only needed for email)
